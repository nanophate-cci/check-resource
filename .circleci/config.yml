version: 2.1

commands:
  output_system_info:
    description: "Outputs system information"
    steps:
      - run:
          name: Output Full System Information
          command: |
            echo "=== System Information ==="
            echo "Operating System: $(uname -s)"
            echo "Kernel Version: $(uname -r)"
            echo "Architecture: $(uname -m)"
            echo "Host Name: $(hostname)"
            echo "CPU Model: $(lscpu | grep 'Model name' | awk -F ':' '{print $2}' | xargs)"
            echo "CPU Cores: $(lscpu | grep '^CPU\(s\):' | awk '{print $2}')"
            echo "Total RAM: $(free -h | grep '^Mem:' | awk '{print $2}')"
            echo "Current User: $(whoami)"
            echo "Date and Time: $(date)"
            echo "Uptime: $(uptime -p)"
            echo "Disk Usage: $(df -h / | grep '/' | awk '{print $3}') used, $(df -h / | grep '/' | awk '{print $4}') available"

jobs:
  print_system_info_docker:
    docker:
      - image: cimg/base:current  # Using a CircleCI Linux image
    steps:
      - output_system_info  # Reusing the command

  print_system_info_machine:
    machine: true  # This tells CircleCI to use the Machine executor
    steps:
      - output_system_info  # Reusing the command
      - run:
          name: Output System Information Using neofetch
          command: |
            sudo apt install neofetch
            neofetch
workflows:
  version: 2
  build:
    jobs:
      - print_system_info_docker
      - print_system_info_machine
